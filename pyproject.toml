# =============================================================================
# Cybotech — Root pyproject.toml
# Root-level tooling configuration only.
# Actual application dependencies live in backend/pyproject.toml.
# This file configures shared tools (Ruff, mypy) for the whole repository.
# =============================================================================

[tool.ruff]
target-version = "py312"
line-length    = 100
src            = ["backend/src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
]
ignore = [
    "ANN101", # Missing type annotation for `self`
    "ANN102", # Missing type annotation for `cls`
    "S101",   # Use of `assert` (allowed in tests)
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S", "ANN"]
"backend/migrations/**/*.py" = ["ANN", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["cybotech"]

[tool.mypy]
python_version         = "3.12"
strict                 = true
warn_return_any        = true
warn_unused_configs    = true
ignore_missing_imports = false
exclude                = [
    "backend/migrations/",
    "backend/tests/",
]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
