# =============================================================================
# Cybotech — Alembic configuration
# Run migrations from the backend/ directory:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "description"
# =============================================================================

[alembic]
# Path to migration scripts (relative to this file)
script_location = migrations

# Template for new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate slug to avoid overly long filenames
truncate_slug_length = 40

# Timezone for migration timestamps
timezone = UTC

# Database URL — read from environment by env.py (do not hardcode here)
# sqlalchemy.url is set dynamically in migrations/env.py from POSTGRES_* env vars

[post_write_hooks]
# Run Ruff formatter on newly generated migration files
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level    = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level     = WARN
handlers  =
qualname  = sqlalchemy.engine

[logger_alembic]
level     = INFO
handlers  =
qualname  = alembic

[handler_console]
class     = StreamHandler
args      = (sys.stderr,)
level     = NOTSET
formatter = generic

[formatter_generic]
format    = %(levelname)-5.5s [%(name)s] %(message)s
datefmt   = %H:%M:%S
