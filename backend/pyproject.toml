# =============================================================================
# Cybotech Backend — pyproject.toml
# Managed by uv. Run `uv sync` from the backend/ directory.
# =============================================================================

[project]
name            = "cybotech"
version         = "0.1.0"
description     = "Cybotech Agent Memory Security & Red-Team Platform — backend"
readme          = "README.md"
requires-python = ">=3.12,<3.15"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Validation and settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.5",
    # Vector database
    "qdrant-client>=1.9.0,<2.0",
    # Model provider
    "openai>=1.55.0",
    # Utilities
    "python-ulid>=3.0.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "sse-starlette>=2.1.3",
    "httpx>=0.27.2",
    "langgraph>=0.2.0,<1.0",
    "pypdf>=5.0,<7.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.2",

    # Quality
    "ruff>=0.7.4",
    "mypy>=1.13.0",

]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cybotech"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths       = ["tests"]
asyncio_mode    = "auto"
addopts         = "-v --tb=short --strict-markers"
markers         = [
    "unit: fast, isolated unit tests",
    "integration: tests requiring a live database",
    "security: security invariant tests",
    "slow: tests that take more than 5 seconds",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source  = ["src/cybotech"]
omit    = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
