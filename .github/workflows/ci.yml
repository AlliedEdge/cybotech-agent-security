name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cybotech_test_ci
          POSTGRES_USER: cybotech
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cybotech -d cybotech_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cybotech:ci-only-password@127.0.0.1:5432/cybotech_test_ci
      CYBOTECH_TEST_DATABASE_URL: postgresql+psycopg://cybotech:ci-only-password@127.0.0.1:5432/cybotech_test_ci
      CYBOTECH_MODEL_MODE: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: uv run --no-sync ruff check src tests
        working-directory: backend
      - run: uv run --no-sync ruff format --check src tests
        working-directory: backend
      - run: uv run --no-sync mypy src
        working-directory: backend
      - run: uv run --no-sync alembic upgrade head
        working-directory: backend
      - run: uv run --no-sync pytest tests -q
        working-directory: backend
      - run: docker build -t cybotech-backend-check backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend build
      - run: pnpm --dir frontend test --run
